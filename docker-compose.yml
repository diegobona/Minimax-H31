version: '3.8'

services:
  # Next.js 应用
  tinyship-next:
    build:
      context: .
      dockerfile: apps/next-app/Dockerfile
      args:
        # Optional: Pass build args if needed (for CI/CD)
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        - NEXT_PUBLIC_WECHAT_APP_ID=${NEXT_PUBLIC_WECHAT_APP_ID:-}
    image: tinyship-next
    container_name: tinyship-next
    ports:
      - "7001:7001"
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - next

# Usage:
# Start Next.js:    docker-compose --profile next up -d
# Stop:             docker-compose down
# Logs:             docker-compose logs -f
# Rebuild:          docker-compose --profile next up -d --build
